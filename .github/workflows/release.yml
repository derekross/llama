# Build llama for a version tag and publish it as a GitHub Release, with
# SHA256SUMS and build-provenance attestations.
#
#   git tag v0.2.0 && git push github v0.2.0
#
# The tag must match the version in manifest.json and Cargo.toml. Builds run
# on Ubuntu 22.04 (glibc 2.35), natively on x86_64 and aarch64, so the
# binary also runs on older systems than Arch. No build cache: release
# binaries are built from a clean checkout every time. After the release is
# published, pin it with dist/pin-release.sh and commit the result.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # gen-known-hashes.sh --check reads the history

      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version manifest.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "tag=$tag manifest=$manifest cargo=$cargo_version"
          [[ $tag == "$manifest" && $tag == "$cargo_version" ]]
          # Every plugin file this tag installs must be in the table the
          # installer uses to recognise its own files later.
          ./dist/gen-known-hashes.sh --check

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Test skins
        run: ./tests/fetch-skins.sh || echo "::warning::couldn't fetch the test skins; skin tests will skip"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      - name: Installer tests (sandboxed HOME, stubbed tools)
        run: LLAMA_TEST_BINARY=target/release/llama tests/install/run.sh

      - name: Package
        id: package
        run: |
          name="llama-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "dist-out/$name"
          install -m755 target/release/llama "dist-out/$name/"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "dist-out/$name/"
          tar -C dist-out -czf "dist-out/$name.tar.gz" --owner=0 --group=0 "$name"
          echo "file=dist-out/$name.tar.gz" >>"$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.arch }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum llama-*.tar.gz >SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" llama-*.tar.gz SHA256SUMS \
            --title "Llama $GITHUB_REF_NAME" --generate-notes --verify-tag
